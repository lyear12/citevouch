name: Publish

# PyPI is published from *this* workflow and not from release.yml, because PyPI's
# trusted publishing does not accept a reusable workflow as the workflow in a
# publisher.  Its own troubleshooting page says so plainly:
#
#   "Reusable workflows cannot currently be used as the workflow in a Trusted
#    Publisher. This is a practical limitation, and is being tracked in
#    warehouse#11096."
#   -- https://docs.pypi.org/trusted-publishers/troubleshooting/
#
# release.yml is a reusable workflow: auto-release.yml calls it through
# `workflow_call`, and a single call - not just the called file - is what the
# token exchange describes.  Run 43395199793 recorded exactly that, before this
# file existed:
#
#   workflow_ref     = .../auto-release.yml@refs/heads/main
#   job_workflow_ref = .../release.yml@refs/heads/main
#   invalid-publisher: valid token, but no corresponding publisher
#   (Publisher with matching claims was not found)
#
# A workflow that is triggered directly, like this one, has
# workflow_ref == job_workflow_ref and can be registered.
#
# Nothing here builds or tests: release.yml already did both, and the assets on
# the release are the ones it published.  This workflow downloads them, checks
# them against the candidate record release.yml uploaded, and uploads those
# bytes.  If the check fails it publishes nothing.

on:
  # The trigger names `Auto release`, not `Release`, and that is a correction
  # rather than a style choice.  The first version of this file said
  # `workflows: ["Release"]` and could never have fired: release.yml is reusable,
  # so it has no runs of its own.  Measured on 2026-11-16 over the repository's
  # 100 most recent runs: `Auto release` 49, `Test` 48, `Nightly dogfood` 3,
  # `Release` 0 - and run 43793698436 shows where release.yml actually lands,
  # as the jobs `publish the tag / build and publish` inside an Auto release run.
  #
  # A `workflow_run` trigger on a run that itself came from `workflow_run` does
  # fire: `Auto release` is exactly that, started by `Test` completing.
  workflow_run:
    workflows: ["Auto release"]
    types: [completed]
  # The door that does not depend on any of this being true, and the one to use
  # when republishing a tag that predates this workflow:
  #   gh workflow run publish.yml -f tag=v0.32.0
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag whose release assets to publish, e.g. v0.32.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# One publisher.  Deliberately the same group release.yml uses: while this
# workflow uploads, a second release must not be building the same version, and
# a second publish of the same version is a race PyPI resolves by rejecting the
# loser.  Both are workflows with no caller holding the lock, so there is no
# deadlock to avoid (unlike auto-release.yml, whose group is deliberately
# different).
concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    name: upload the released bytes to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # The run that just finished, not whatever `main` says now: the bytes
          # belong to the commit whose release exists.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the tag
        id: v
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            # A workflow_run payload names the run's branch (`main`), not a tag,
            # so the tag comes from the version file at that same commit - the
            # single place a version is written.
            version=$(python -c 'import pathlib, re; text = pathlib.Path("src/citevouch/_version.py").read_text(encoding="utf-8"); print(re.search(r"__version__ = \"([^\"]+)\"", text).group(1))')
            tag="v$version"
          fi
          case "$tag" in
            v?*) ;;
            *)
              echo "::error::could not resolve a v-prefixed tag from '$tag'; pass one with -f tag=vX.Y.Z"
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Stop quietly if there is nothing for this run to publish
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          version="${{ steps.v.outputs.version }}"
          # Every push to main finishes an Auto release run, and most of them
          # decide not to release.  Saying "nothing to publish" and exiting 0 is
          # the honest outcome; going red would train everyone to ignore this
          # workflow, which is the failure this whole file exists to avoid.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is not released yet, so there is nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Idempotence, and the reason a re-run is harmless: PyPI serves an
          # immutable version, so an existing one is already done.  This is also
          # the check docs/maintenance.md prints, so the run and the reader use
          # the same evidence.
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/citevouch/$version/json")
          if [ "$code" = "200" ]; then
            echo "::notice::PyPI already serves $version, so this run leaves it alone"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PyPI answers $code for $version, so this run publishes it"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download the assets the release already carries
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          rm -rf dist
          mkdir -p dist
          if ! gh release download "$tag" --dir dist --clobber; then
            echo "::error::$tag has no release assets to publish; publish the GitHub release first"
            exit 1
          fi
          ls -la dist

      - name: The bytes about to be uploaded must be the bytes the release recorded
        if: steps.gate.outputs.publish == 'true'
        run: |
          # The candidate record is uploaded with the release, so this compares
          # the downloaded bytes against the digests written by the run that
          # built them.  A missing or mismatched record stops the upload: PyPI
          # versions are immutable, so "close enough" is not a recoverable answer.
          python tools/release_candidate.py check dist

      - name: Publish to PyPI
        id: pypi
        if: steps.gate.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        # Deliberately NOT continue-on-error: this workflow exists only to
        # publish, so a failure here is the whole result.  A red run is the
        # honest signal, and re-running it after the Owner registers the
        # publisher is the repair - nothing is rebuilt and nothing moves.
        with:
          packages-dir: dist

      - name: Summarise
        if: always()
        run: |
          {
            echo "### PyPI: ${{ steps.v.outputs.tag }}"
            echo ""
            if [ "${{ steps.gate.outputs.publish }}" != "true" ]; then
              echo "Nothing was uploaded.  Either that tag has no release yet, or"
              echo "PyPI already serves it - the step above says which."
            elif [ "${{ steps.pypi.outcome }}" = "success" ]; then
              echo "Published \`${{ steps.v.outputs.version }}\` to PyPI."
              echo ""
              echo "Verify from outside this machine:"
              echo ""
              echo '```console'
              echo "curl -s -o /dev/null -w '%{http_code}' https://pypi.org/pypi/citevouch/json"
              echo '```'
            else
              echo "**Not published.**  The run above says why.  The two failures"
              echo "worth telling apart:"
              echo ""
              echo "* \`invalid-publisher\` - the trusted publisher registered on"
              echo "  pypi.org does not match this workflow's identity.  The form"
              echo "  must name workflow \`publish.yml\`, repository \`lyear12/citevouch\`,"
              echo "  and no environment."
              echo "* \`invalid-payload\` or \`invalid-token\` - the token exchange itself"
              echo "  failed, which is about this run and not about the form."
              echo ""
              echo "The GitHub release still carries the same wheel and sdist:"
              echo "\`pip install\` from that URL works either way."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
