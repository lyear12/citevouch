name: Release

# A release is a tag. Pushing `v0.1.4` runs this workflow, which refuses to
# publish unless the tag and the declared version agree, then builds the sdist
# and wheel, checks the built wheel in a clean environment, and only then creates
# the release. There is no step where a human confirms — the tag *is* the
# confirmation, and the failure modes below are cheap to re-run.
#
# It can be started three ways: by a tag push (a person, or a script, decided to
# release), by `workflow_dispatch` (a person naming the version), or by
# `workflow_call` from auto-release.yml, which is the usual path: that workflow
# reads the changelog, decides the number, commits it, tags it, and calls this
# one to build it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, e.g. 0.1.4 (no leading v)"
        required: true
  workflow_call:
    inputs:
      version:
        description: "version to release, e.g. 0.1.4 (no leading v)"
        required: true
        type: string
      candidate:
        description: "the commit whose Test run went green, if the caller knows it"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

# One publisher, whichever door the release came through: a tag push, a
# `workflow_dispatch` by hand, or `workflow_call` from auto-release.yml. Two
# runs that both believe they own this version would race on the same tag, the
# same draft release and the same PyPI upload; the loser's failure is
# indistinguishable from a real defect, and the winner's assets can be
# replaced by `--clobber` in the recovery step below.
#
# The group is deliberately NOT the one auto-release.yml uses (`auto-release`).
# A reusable workflow inherits nothing from its caller, but a caller that holds
# a group while its called workflow waits for the same group would deadlock:
# the run that would free the lock is the one blocked on it. Keeping the two
# names apart is what makes the exclusion effective without wedging the usual
# path, and it is why this comment exists — renaming either one to match the
# other looks like tidying and stops every release.
concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the version
        id: v
        run: |
          # `inputs.version` covers both workflow_dispatch and workflow_call;
          # a tag push has no inputs, and the tag is the version.
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build the tag, not the commit this run happened to start from
        id: at
        run: |
          # A reusable workflow called from auto-release is started by the
          # workflow_run event, whose checkout is the commit main pointed at
          # *when the event fired* - which is the commit before the version
          # bump. Building that would publish 0.2.0's number on 0.1.0's code.
          # The tag is the artifact; if it exists, everything downstream reads
          # that and only that.
          tag="${{ steps.v.outputs.tag }}"
          git fetch --tags --force origin "+refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git -c advice.detachedHead=false checkout --force "refs/tags/$tag"
            echo "building $tag at $(git rev-parse --short HEAD)"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch for a version whose tag does not exist yet is
            # the documented way to release by hand; the create step below names
            # this commit as the tag's target, which is the only case where
            # target_commitish is both needed and valid.
            echo "no tag $tag yet; building the checked-out commit $(git rev-parse --short HEAD)"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record which commit is being released, and whether it descends from the tested one
        id: tree
        run: |
          # The version-bump commit is made *by* auto-release after the green
          # Test, so the tag never points at the tested SHA itself. What has to
          # be true is that the tested commit is an ancestor and nothing but the
          # bump sits between them: that is the only difference the suite did
          # not see, and it is a version number and a changelog heading.
          echo "release tree: $(git rev-parse HEAD)"
          candidate="${{ inputs.candidate }}"
          if [ -z "$candidate" ]; then
            echo "::notice::no candidate SHA supplied - this run came from a tag push or a manual dispatch, so the tag is the whole claim"
            exit 0
          fi
          echo "tested commit: $candidate"
          if ! git cat-file -e "$candidate^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$candidate" 2>/dev/null || true
          fi
          if ! git merge-base --is-ancestor "$candidate" HEAD; then
            echo "::error::the tested commit $candidate is not an ancestor of the tree being released ($(git rev-parse HEAD))"
            exit 1
          fi
          between=$(git rev-list --count "$candidate..HEAD")
          echo "$between commit(s) between the tested commit and the tag"
          # One commit - the bump - is the expected shape. More than one means
          # something else landed after the test, which is exactly the race this
          # guard exists to notice.
          if [ "$between" -gt 1 ]; then
            echo "::error::$between commits landed between the green Test for $candidate and the release tree; the suite never saw $(git rev-list --oneline "$candidate..HEAD" | tail -n +2 | tr '\\n' ' ')"
            exit 1
          fi
          echo "source_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag and the declared version must agree
        run: |
          # The declaration is src/citevouch/_version.py; pyproject.toml reads it
          # through [tool.setuptools.dynamic]. Check the source of truth, not a
          # copy of it that could be stale.
          declared=$(python -c "import sys;sys.path.insert(0,'src');from citevouch._version import __version__;print(__version__)")
          if [ "$declared" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::releasing ${{ steps.v.outputs.version }} from $(git rev-parse --short HEAD) but src/citevouch/_version.py there says $declared"
            exit 1
          fi

      - name: Run the suite before building anything
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          ruff check .
          ruff format --check .

      - name: Build
        run: |
          python -m pip install build
          python -m build
          # `python -m build` stamps each archive member with the wall clock and
          # the sdist's gzip header with it too, so two builds of one tree used
          # to differ in bytes while agreeing in content. The repair step below
          # refuses to replace a published asset whose digest differs, which is
          # right - and without this line it would also make a resumed release
          # impossible, since the rebuild can never match what was published.
          python tools/normalise_artifacts.py dist

      - name: Record which commit produced these bytes
        id: record
        # The workflow resolves three commits - the tested one, the source one
        # and the release one - and until now they lived only in this run's log.
        # A file in `dist/` is uploaded by the very next step, so the record
        # travels with the artefacts: someone holding the wheel can read which
        # commit built it and what the other files in the release weigh, and a
        # resumed run can compare instead of guessing whether the rebuild is the
        # same build.
        #
        # `steps.tree` writes its outputs only on the candidate path; a tag push
        # or a manual dispatch has no tested commit to name, and the honest
        # answer there is the tree being released, which is what the fallback
        # says rather than an empty field that reads like a missing fact.
        run: |
          release_sha="$(git rev-parse HEAD)"
          source_sha="${{ steps.tree.outputs.source_sha }}"
          if [ -z "$source_sha" ]; then
            source_sha="$release_sha"
          fi
          python tools/release_candidate.py write dist \
            --version "${{ steps.v.outputs.version }}" \
            --tag "${{ steps.v.outputs.tag }}" \
            --candidate "${{ inputs.candidate }}" \
            --source-sha "$source_sha" \
            --release-sha "$release_sha"

      - name: Smoke-test the built wheel in a clean directory
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/citevouch --version
          # init-demo records the ledger, so verify is the whole smoke test:
          # if the packaged console script cannot scaffold and then check its
          # own scaffold, the wheel is not installable in any useful sense.
          cd /tmp && /tmp/clean/bin/citevouch init-demo smoke
          cd /tmp/smoke && /tmp/clean/bin/citevouch verify manuscript.md

      - name: Publish to PyPI
        id: pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        # PyPI publication needs a trusted publisher registered on pypi.org for
        # this repository, which is an account action this workflow cannot take
        # for itself. It is therefore allowed to fail without failing the
        # release: the GitHub release carries the same artefacts and is the
        # distribution that always works. The step *after* this one records
        # which of the two happened, so "PyPI is not set up yet" is visible in
        # the run instead of being swallowed by continue-on-error.
        continue-on-error: true

      - name: Create the release
        id: create
        # The recovery step below decides whether this failure is fine (the
        # release exists already - a re-run of an interrupted release) or fatal
        # (the API said no for a reason we should read). Gating on this step's
        # outcome is why it is not `if: failure()`: that would also fire when
        # the build or the smoke test failed, two steps whose logs are the
        # whole point.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          # The notes describe *this* release, so they are the commits since
          # the previous tag - not "the last forty commits", which is what this
          # said first and what made v0.2.0's notes list 0.1.0's work plus a
          # dozen "Release x.y.z" subjects of its own.
          #
          # The logic is a script, not a block, because a block cannot be run
          # by a test without transplanting the YAML around it - and the case
          # that broke was the one nobody runs by hand: a hand-dispatched
          # version whose tag does not exist yet, where `git describe` exits
          # non-zero and `set -e` turned a missing range into a dead release.
          #
          # It is invoked through `bash`, not by path. The index stores the file
          # without the executable bit, so a fresh checkout on a Linux runner
          # gets 644 and a bare `tools/release_notes.sh` is "Permission denied" -
          # a failure that cannot happen locally on Windows, where every file
          # with a shebang looks executable.
          notes=$(bash tools/release_notes.sh "$tag")
          # target_commitish is a branch name or a commit SHA, never a tag name,
          # and it is unused when the tag already exists. Passing the tag was
          # what failed the first automatic release (0.2.1): the API answered
          # "Release.target_commitish is invalid". So the flag belongs only to
          # the path that has to create the tag.
          if [ "${{ steps.at.outputs.tag_exists }}" = "true" ]; then
            gh release create "$tag" dist/* --title "$tag" --notes "$notes"
          else
            gh release create "$tag" dist/* --title "$tag" --notes "$notes" \
              --target "$GITHUB_SHA"
          fi
      - name: Re-attach artefacts if the release already existed
        # Runs only when the create step above failed, which continue-on-error
        # lets reach here. If the release exists, the failure was "already
        # created" - an interrupted release being resumed - and attaching the
        # fresh artefacts is the right repair. Anything else stays red with the
        # create step's own error visible above.
        #
        # "Exists" is not the same as "published". `gh release create` attaches
        # assets by creating a *draft* release, uploading to it, and publishing
        # it - three API calls. v0.22.14 died between the first and the third:
        # the create call answered `HTTP 502: Server Error`, the draft existed
        # anyway, this step found it, uploaded the wheel and sdist, and exited
        # zero. The run was green, the assets were there, and the release was a
        # draft nobody could see - which is strictly worse than a red run,
        # because nothing in the log said a word about it. So the recovery also
        # has to finish the job the create step was doing: publish the draft.
        if: steps.create.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; re-attaching artefacts"
            # An asset with this name may already be published with *different*
            # bytes: an interrupted upload resumed after a rebuild produces
            # exactly that. `gh release upload --clobber` would replace it
            # silently, and the digest the world can verify would then describe
            # a build nobody chose. So the published digest is what decides -
            # equal is a resumed release, anything else stops the run. A
            # published asset whose digest GitHub does not report is also a
            # stop: "I cannot tell whether these are the same bytes" is not a
            # licence to overwrite.
            published=$(gh release view "$tag" --json assets \
              --jq '.assets[] | "\(.name)\t\(.digest // "")"' 2>/dev/null || true)
            set --
            for path in dist/*; do
              [ -f "$path" ] || continue
              name=$(basename "$path")
              if ! printf '%s\n' "$published" | awk -F '\t' -v n="$name" '$1 == n { found = 1 } END { exit !found }'; then
                set -- "$@" "$path"
                continue
              fi
              theirs=$(printf '%s\n' "$published" \
                | awk -F '\t' -v n="$name" '$1 == n { print $2; exit }')
              ours="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
              if [ "$theirs" != "$ours" ]; then
                echo "::error::$tag already publishes $name with digest ${theirs:-(none recorded)}, but this run built $ours. Refusing to replace a published asset. If the new build is the right one, delete the old asset (gh release delete-asset $tag $name) and re-run."
                exit 1
              fi
              echo "$name is already published with the digest this run built"
            done
            if [ "$#" -gt 0 ]; then
              gh release upload "$tag" "$@" --clobber
            else
              echo "every artefact is already published with the digest this run built"
            fi
          else
            echo "::error::release $tag could not be created and does not exist"
            exit 1
          fi
          # `isDraft` is what decides this, not the existence of the release.
          # A recovered release that stays a draft is invisible to the install
          # instructions, to the README badge and to anyone watching the repo,
          # while every step reports success.
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "release $tag is a draft; publishing it"
            gh release edit "$tag" --draft=false
          fi
          # The last word comes from the API rather than from the step that just
          # succeeded at something else: a draft here means this run is a lie.
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "::error::release $tag is still a draft after the repair"
            exit 1
          fi
          echo "release $tag is published"

      - name: Fetch the published assets back and check them against the record
        # A digest on a release page is a claim by the service that hosts the
        # file. This step stops taking that on faith: it downloads what the
        # release actually serves and recomputes every hash against the record
        # this run wrote. An upload that reported success and stored a truncated
        # body, an asset attached to the wrong release, a record that disagrees
        # with the bytes - all of them fail here, which is the only place in the
        # workflow where the published thing is read rather than written.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          rm -rf retrieved && mkdir retrieved
          gh release download "$tag" --dir retrieved --clobber
          python tools/release_candidate.py check retrieved
          echo "::notice::$tag serves back the bytes this run built"

      - name: Summarise
        run: |
          echo "### Released ${{ steps.v.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.pypi.outcome }}" = "success" ]; then
            echo "PyPI: published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PyPI: **not published** (the trusted publisher is not registered for" \
                 "this repository yet). The GitHub release below carries the same wheel" \
                 "and sdist: \`pip install citevouch\` does not work until PyPI is set up." \
                 >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate record (uploaded as \`release-candidate.json\`):" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/release-candidate.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la dist >> "$GITHUB_STEP_SUMMARY"
