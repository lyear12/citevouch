name: Release

# A release is a tag. Pushing `v0.1.4` runs this workflow, which refuses to
# publish unless the tag and pyproject.toml agree, then builds the sdist and
# wheel, checks the built wheel in a clean environment, and only then creates
# the release. There is no step where a human confirms — the tag *is* the
# confirmation, and the failure modes below are cheap to re-run.
#
# It can be started three ways: by a tag push (a person, or a script, decided to
# release), by `workflow_dispatch` (a person naming the version), or by
# `workflow_call` from auto-release.yml, which is the usual path: that workflow
# reads the changelog, decides the number, commits it, tags it, and calls this
# one to build it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, e.g. 0.1.4 (no leading v)"
        required: true
  workflow_call:
    inputs:
      version:
        description: "version to release, e.g. 0.1.4 (no leading v)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the version
        id: v
        run: |
          # `inputs.version` covers both workflow_dispatch and workflow_call;
          # a tag push has no inputs, and the tag is the version.
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build the tag, not the commit this run happened to start from
        id: at
        run: |
          # A reusable workflow called from auto-release is started by the
          # workflow_run event, whose checkout is the commit main pointed at
          # *when the event fired* - which is the commit before the version
          # bump. Building that would publish 0.2.0's number on 0.1.0's code.
          # The tag is the artifact; if it exists, everything downstream reads
          # that and only that.
          tag="${{ steps.v.outputs.tag }}"
          git fetch --tags --force origin "+refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git -c advice.detachedHead=false checkout --force "refs/tags/$tag"
            echo "building $tag at $(git rev-parse --short HEAD)"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch for a version whose tag does not exist yet is
            # the documented way to release by hand; the create step below names
            # this commit as the tag's target, which is the only case where
            # target_commitish is both needed and valid.
            echo "no tag $tag yet; building the checked-out commit $(git rev-parse --short HEAD)"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and the declared version must agree
        run: |
          # The declaration is src/citevouch/_version.py; pyproject.toml reads it
          # through [tool.setuptools.dynamic]. Check the source of truth, not a
          # copy of it that could be stale.
          declared=$(python -c "import sys;sys.path.insert(0,'src');from citevouch._version import __version__;print(__version__)")
          if [ "$declared" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::releasing ${{ steps.v.outputs.version }} from $(git rev-parse --short HEAD) but src/citevouch/_version.py there says $declared"
            exit 1
          fi

      - name: Run the suite before building anything
        run: |
          python -m pip install -e . pytest ruff
          python -m pytest -q
          ruff check .
          ruff format --check .

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Smoke-test the built wheel in a clean directory
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/citevouch --version
          # init-demo records the ledger, so verify is the whole smoke test:
          # if the packaged console script cannot scaffold and then check its
          # own scaffold, the wheel is not installable in any useful sense.
          cd /tmp && /tmp/clean/bin/citevouch init-demo smoke
          cd /tmp/smoke && /tmp/clean/bin/citevouch verify manuscript.md

      - name: Publish to PyPI
        id: pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        # PyPI publication needs a trusted publisher registered on pypi.org for
        # this repository, which is an account action this workflow cannot take
        # for itself. It is therefore allowed to fail without failing the
        # release: the GitHub release carries the same artefacts and is the
        # distribution that always works. The step *after* this one records
        # which of the two happened, so "PyPI is not set up yet" is visible in
        # the run instead of being swallowed by continue-on-error.
        continue-on-error: true

      - name: Create the release
        id: create
        # The recovery step below decides whether this failure is fine (the
        # release exists already - a re-run of an interrupted release) or fatal
        # (the API said no for a reason we should read). Gating on this step's
        # outcome is why it is not `if: failure()`: that would also fire when
        # the build or the smoke test failed, two steps whose logs are the
        # whole point.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          notes=$(git log --pretty=format:'- %s' -n 40 "HEAD" -- . | head -60)
          # target_commitish is a branch name or a commit SHA, never a tag name,
          # and it is unused when the tag already exists. Passing the tag was
          # what failed the first automatic release (0.2.1): the API answered
          # "Release.target_commitish is invalid". So the flag belongs only to
          # the path that has to create the tag.
          if [ "${{ steps.at.outputs.tag_exists }}" = "true" ]; then
            gh release create "$tag" dist/* --title "$tag" --notes "$notes"
          else
            gh release create "$tag" dist/* --title "$tag" --notes "$notes" \
              --target "$GITHUB_SHA"
          fi
      - name: Re-attach artefacts if the release already existed
        # Runs only when the create step above failed, which continue-on-error
        # lets reach here. If the release exists, the failure was "already
        # created" - an interrupted release being resumed - and attaching the
        # fresh artefacts is the right repair. Anything else stays red with the
        # create step's own error visible above.
        if: steps.create.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; re-attaching artefacts"
            gh release upload "$tag" dist/* --clobber
          else
            echo "::error::release $tag could not be created and does not exist"
            exit 1
          fi

      - name: Summarise
        run: |
          echo "### Released ${{ steps.v.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.pypi.outcome }}" = "success" ]; then
            echo "PyPI: published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PyPI: **not published** (the trusted publisher is not registered for" \
                 "this repository yet). The GitHub release below carries the same wheel" \
                 "and sdist: \`pip install citevouch\` does not work until PyPI is set up." \
                 >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist >> "$GITHUB_STEP_SUMMARY"
