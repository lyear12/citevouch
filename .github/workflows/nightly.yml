name: Nightly dogfood

# The nightly half of docs/maintenance.md's loop. The push CI proves the
# repository is good; this proves the thing people actually install - the
# wheel of the latest release, from GitHub's servers, in an environment nobody
# has cached - still does the documented commands with the documented results.
#
# It opens an issue when it fails, because a red scheduled run nobody reads is
# how drift becomes permanent. The issue is the feedback the maintenance loop
# consumes; closing it is a person deciding the report was worth fixing, which
# is the one human step docs/maintenance.md reserves.

on:
  schedule:
    # 06:17 UTC daily - off the hour so the fleet of nightly jobs does not
    # all queue at the same minute.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest-release:
    name: install and run the newest published artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the newest release by version
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's "latest" pointer is the newest release by *creation date*,
          # not by version number: backfill a release for an old tag and latest
          # moves to the old version. Trusting it here would have the nightly
          # install a superseded wheel and call it fresh, which is the opposite
          # of what a dogfood proves. Sort the version list itself; this
          # happened for real when v0.2.1 was re-cut and became "latest".
          # Pre-releases are dropped before sorting: `-k3,3n` reads "0-rc1"
          # as 0, the keys then tie, and the line comparison puts "1.0.0-rc1"
          # after "1.0.0" because "-" (0x2D) beats nothing. The nightly then
          # tests a version nobody installs, which is the one thing a
          # dogfood must not do.
          tag=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
                | grep -v -- '-' \
                | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          tag="v$tag"
          url=$(gh release view "$tag" --json assets \
                --jq '.assets[] | select(.name|endswith(".whl")) | .url' | head -1)
          if [ -z "$tag" ] || [ -z "$url" ]; then
            echo "::error::no release with a wheel found"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "testing $tag"

      - name: Install the wheel in a clean environment and dogfood it
        id: run
        run: |
          python -m venv /tmp/dogfood
          /tmp/dogfood/bin/pip install "${{ steps.rel.outputs.url }}"
          cd "$(mktemp -d)"
          /tmp/dogfood/bin/citevouch --version
          /tmp/dogfood/bin/citevouch init-demo paper
          cd paper
          /tmp/dogfood/bin/citevouch verify manuscript.md
          # The documented first-run promise: one claim, verified, exit 0.
          /tmp/dogfood/bin/citevouch verify manuscript.md --format json | python -c '
          import json,sys
          b=json.load(sys.stdin)
          s=b["summary"]
          if s["verified"] != 1 or s["missing"] != 0 or s["findings"] == 0:
              sys.exit(f"init-demo project came back wrong: {s}")
          '

      - name: Open (or update) an issue when the published artefact rotted
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The label has to exist before it can be applied: `gh issue create
          # --label` fails outright on an unknown label, so the first real
          # dogfood failure - the one moment this feedback loop exists for -
          # would have reported nothing at all. Creating it is idempotent.
          gh label create nightly-dogfood --description "the nightly run of the published artefact failed" --color "B60205" 2>/dev/null || true

          title="nightly dogfood failed for $TAG"
          # The title is compared in python rather than interpolated into a
          # jq program: `gh --jq` takes no extra arguments, so there is no safe
          # way to pass a string into the filter, and this is an error path -
          # the worst place to carry a query that only sometimes parses.
          export TITLE="$title"
          existing=$(gh issue list --label nightly-dogfood --state open --json number,title | python -c '
          import json, os, sys
          want = os.environ["TITLE"]
          for item in json.load(sys.stdin):
              if item["title"] == want:
                  print(item["number"])
                  break
          ')
          if [ -n "$existing" ]; then
            echo "an open dogfood issue for $TAG already exists; refreshing comment"
            gh issue comment "$existing" --body "still failing as of $(date -u +%FT%TZ) - $RUN"
            exit 0
          fi

          body="The scheduled run that installs the latest release wheel and replays the README's first commands failed on $(date -u +%F).

          Run log: $RUN

          What this means: people installing $TAG today may be getting something that does not do what the documentation shows. The run log above has the exact step and its output. This issue was filed by the night itself, not by a person who noticed."
          gh issue create --title "$title" --body "$body" --label "nightly-dogfood"
