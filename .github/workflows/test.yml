name: Test

# Every change is checked on the three platforms the tool claims to support.
# A release waits for a green run here: see release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          # macos-latest is arm64, and CPython never published a macOS arm64
          # build for 3.10 - the interpreter only exists there under Rosetta.
          # Leaving the cell in does not test old Python on macOS; it sits in
          # the queue until the run is cancelled, which reads as an infra
          # flake and hides that the claim was never checkable. 3.10 is
          # covered on Linux and Windows, where it can actually run.
          - os: macos-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run the suite
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The repository-rules check reads commit messages, which a shallow
        # checkout does not have. fetch-depth: 0 is honest cost for a small
        # repository; a deeper failure path would skip the check instead of
        # silently passing it.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest ruff
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: repository rules
        # The rules this project states about itself, checked rather than
        # remembered: commit-message evidence sections, lesson promotions, and
        # whether the "N passed" a message claims is the number the suite
        # actually reports. That last one is only checkable where the tests
        # ran, which is why the count is measured here rather than assumed.
        # On a push, police exactly the commits the push carried; on anything
        # else (PR, dispatch) fall back to the last ten, which still catches
        # a nonconforming head commit.
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$base" ] \
             && git cat-file -e "$base^{commit}" 2>/dev/null; then
            range="$base..$GITHUB_SHA"
          else
            range="$(git rev-parse HEAD~10 2>/dev/null || git rev-parse HEAD^)..HEAD"
          fi
          echo "policing commits in $range"
          # The pytest config already passes -q, so the count comes from a
          # plain run: -qq is a different verbosity and drops the summary line
          # the number lives in.  Reading 0 out of that silence is how this
          # step first failed on the very change that introduced it.
          if ! python -m pytest > /tmp/suite.log 2>&1; then
            tail -40 /tmp/suite.log
            echo "::error::the suite did not pass, so the counts cannot be compared"
            exit 1
          fi
          passed=$(grep -oE '[0-9]+ passed' /tmp/suite.log | tail -1 | cut -d' ' -f1)
          tail -2 /tmp/suite.log
          if [ -z "$passed" ]; then
            tail -40 /tmp/suite.log
            echo "::error::the suite ran but its summary line was not found, so no count can be compared"
            exit 1
          fi
          echo "the suite reports $passed passing tests"
          python tools/check_repo_rules.py --range "$range" --passed "$passed"

  acceptance:
    name: acceptance (the documented first run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest

      # The first command in the README, run from a directory that contains
      # nothing. A tool that only works in its own checkout does not work.
      - name: init-demo succeeds
        run: |
          cd "$(mktemp -d)"
          python -m citevouch init-demo my-paper
          # init-demo records the ledger too, so the README's next command is
          # the only thing this step needs to run.
          cd my-paper
          python -m citevouch verify manuscript.md

      # The committed demo has exactly one deliberate failure. A greener run
      # means matching became more permissive, which is a regression.
      - name: the demo still says no to the wrong paper
        run: |
          set +e
          python -m citevouch verify demo/manuscript.md --root demo --format json > /tmp/out.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 from the demo (its fcg-editor claim cites the wrong PDF), got $code"
            exit 1
          fi
          python -c 'import json,sys; b=json.load(open("/tmp/out.json")); m=[f.get("claim_id") for f in b["findings"] if f["code"]=="quote-missing"]; sys.exit("the deliberate quote-missing is gone, or it moved: %r; matching changed" % (m,)) if m!=["fcg-editor"] else print("demo acceptance OK:", b["summary"])'

      - name: offline
        run: python -m pytest -q -k "not network"
        env:
          # Nothing in src/ may reach the network; the suite proves it by
          # running with proxies pointed at a closed port.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
