name: Test

# Every change is checked on the three platforms the tool claims to support.
# A release waits for a green run here: see release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          # macos-latest is arm64, and CPython never published a macOS arm64
          # build for 3.10 - the interpreter only exists there under Rosetta.
          # Leaving the cell in does not test old Python on macOS; it sits in
          # the queue until the run is cancelled, which reads as an infra
          # flake and hides that the claim was never checkable. 3.10 is
          # covered on Linux and Windows, where it can actually run.
          - os: macos-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the suite
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The repository-rules check reads commit messages, which a shallow
        # checkout does not have. fetch-depth: 0 is honest cost for a small
        # repository; a deeper failure path would skip the check instead of
        # silently passing it.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # setuptools is named here because this job builds the sdist below with
      # --no-isolation, and an editable install builds through its own isolated
      # environment: it leaves no build backend behind. Without the name, the
      # build step fails with "Cannot import 'setuptools.build_meta'" - which is
      # exactly how this job first failed after the sdist test was added.
      - run: python -m pip install -e ".[dev]" build setuptools
      - name: ruff
        # format --check runs through tools/format_check.sh: it measures the
        # tracked files, not whatever happens to be in the working tree. The
        # plain `ruff format --check .` counts untracked drafts too, so the
        # number it prints depends on which machine ran it - and three
        # releases quoted a file count that was only true locally.
        run: |
          ruff check .
          sh tools/format_check.sh
      - name: repository rules
        # The rules this project states about itself, checked rather than
        # remembered: commit-message evidence sections, lesson promotions, and
        # whether the "N passed" a message claims is the number the suite
        # actually reports. That last one is only checkable where the tests
        # ran, which is why the count is measured here rather than assumed.
        # On a push, police exactly the commits the push carried; on anything
        # else (PR, dispatch) fall back to the last ten, which still catches
        # a nonconforming head commit.
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$base" ] \
             && git cat-file -e "$base^{commit}" 2>/dev/null; then
            range="$base..$GITHUB_SHA"
          else
            range="$(git rev-parse HEAD~10 2>/dev/null || git rev-parse HEAD^)..HEAD"
          fi
          echo "policing commits in $range"
          # Build the archive before running the suite: one test in it reads
          # `dist/`, and this job refuses to skip. Building it here is also the
          # only place the manifest is exercised before a release.
          python -m build --sdist --no-isolation > /tmp/build.log 2>&1 || {
            cat /tmp/build.log
            echo "::error::python -m build failed, so one test would have skipped"
            exit 1
          }
          # The pytest config already passes -q, so the count comes from a
          # plain run: -qq is a different verbosity and drops the summary line
          # the number lives in.  Reading 0 out of that silence is how this
          # step first failed on the very change that introduced it.
          if ! python -m pytest > /tmp/suite.log 2>&1; then
            tail -40 /tmp/suite.log
            echo "::error::the suite did not pass, so the counts cannot be compared"
            exit 1
          fi
          passed=$(grep -oE '[0-9]+ passed' /tmp/suite.log | tail -1 | cut -d' ' -f1)
          tail -2 /tmp/suite.log
          if [ -z "$passed" ]; then
            tail -40 /tmp/suite.log
            echo "::error::the suite ran but its summary line was not found, so no count can be compared"
            exit 1
          fi
          echo "the suite reports $passed passing tests"
          # A skip is a test that did not run. The shell tests skip only on a
          # Windows machine with no bash; left unreported, that is a suite that
          # shrank without anyone saying so - a gate that opens itself.
          #
          # This lint job is the "no skips" job, so it must not be the job that
          # skips. `tests/test_sdist_contents.py` needs a built archive and
          # skips loudly without one ("no sdist in dist/"), which is the right
          # behaviour everywhere except here: build it first, so this run has
          # no honest reason to skip anything.
          if grep -qE '[0-9]+ skipped' /tmp/suite.log; then
            grep -E 'skipped|SKIPPED' /tmp/suite.log | tail -20
            echo "::error::the suite skipped tests; a skipped test proves nothing"
            exit 1
          fi
          formatted=$(sh tools/format_check.sh 2>&1 | grep -oE '[0-9]+ files' | tail -1 | cut -d' ' -f1)
          # The archive's own suite is a second measurement a commit may cite,
          # and a number this job cannot measure is a number the gate must
          # either reject or wave through. Rejecting teaches the next agent to
          # write less evidence; waving through is what this gate exists to
          # prevent. So measure it here too: the archive is already built two
          # steps up, and one more run of a suite is cheaper than a rule nobody
          # can satisfy honestly.
          mkdir -p /tmp/archive-suite
          tar xzf dist/*.tar.gz -C /tmp/archive-suite
          (
            cd /tmp/archive-suite/citevouch-*
            PYTHONPATH=src python -m pytest > /tmp/archive.log 2>&1 || {
              tail -40 /tmp/archive.log
              echo "::error::the archive's own suite failed; see the sdist job"
              exit 1
            }
          )
          archive=$(grep -oE '[0-9]+ passed' /tmp/archive.log | tail -1 | cut -d' ' -f1)
          if [ -z "$archive" ]; then
            tail -40 /tmp/archive.log
            echo "::error::the archive's suite ran but its summary line was not found"
            exit 1
          fi
          echo "the archive's suite reports $archive passing tests"
          python tools/check_repo_rules.py --range "$range" --passed "$passed" \
            --passed "$archive" --formatted "${formatted:-0}"

  acceptance:
    name: acceptance (the documented first run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"

      # The first command in the README, run from a directory that contains
      # nothing. A tool that only works in its own checkout does not work.
      - name: init-demo succeeds
        run: |
          cd "$(mktemp -d)"
          python -m citevouch init-demo my-paper
          # init-demo records the ledger too, so the README's next command is
          # the only thing this step needs to run.
          cd my-paper
          python -m citevouch verify manuscript.md

      # The committed demo has exactly one deliberate failure. A greener run
      # means matching became more permissive, which is a regression.
      - name: the demo still says no to the wrong paper
        run: |
          set +e
          python -m citevouch verify demo/manuscript.md --root demo --format json > /tmp/out.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 from the demo (its fcg-editor claim cites the wrong PDF), got $code"
            exit 1
          fi
          python -c 'import json,sys; b=json.load(open("/tmp/out.json")); m=[f.get("claim_id") for f in b["findings"] if f["code"]=="quote-missing"]; sys.exit("the deliberate quote-missing is gone, or it moved: %r; matching changed" % (m,)) if m!=["fcg-editor"] else print("demo acceptance OK:", b["summary"])'

      - name: offline
        # The same suite again with the proxies pointed at a closed port: a
        # real network call in src/ fails here instead of succeeding quietly
        # on a machine that happens to have one. This read `-k "not network"`
        # for a while, which selected every test - no such marker exists, and
        # a filter that matches everything reads like it is doing something.
        run: python -m pytest
        env:
          # Nothing in src/ may reach the network; the suite proves it by
          # running with proxies pointed at a closed port.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""

  sdist:
    name: sdist (the archive as published, unpacked and tested)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" build setuptools

      # The release workflow smoke-tests the wheel and never looks at the
      # sdist, so for a while the source archive shipped `graft tests` without
      # the files those tests read. Unpacking a released 0.16.1 gave 56
      # failures and 3 errors. Nobody notices that from the repository, because
      # the repository has every file.
      - name: build the archive and run its own suite
        run: |
          python -m build --sdist --no-isolation
          mkdir -p /tmp/unpacked
          tar xzf dist/*.tar.gz -C /tmp/unpacked
          cd /tmp/unpacked/citevouch-*
          PYTHONPATH=src python -m pytest

      # Skips are allowed here, but only for reasons that are about the
      # checkout rather than about the code: an unpacked archive has no `git`
      # index, so the tests that count tracked files skip themselves, and it
      # has no `dist/`, so the tests that read the archive it is itself in
      # skip too. Any other skip would be a test going quiet, which is the
      # failure mode this job exists to catch - so each SKIPPED line must name
      # one of those two reasons, whatever the count.
      - name: every skip in an unpacked sdist says why it is not a checkout
        run: |
          mkdir -p /tmp/unpacked2
          tar xzf dist/*.tar.gz -C /tmp/unpacked2
          cd /tmp/unpacked2/citevouch-*
          PYTHONPATH=src python -m pytest -rs > /tmp/sdist.log 2>&1 || {
            cat /tmp/sdist.log
            echo "::error::the unpacked archive's suite failed; see above"
            exit 1
          }
          skips=$(grep "^SKIPPED" /tmp/sdist.log || true)
          if [ -z "$skips" ]; then
            echo "::error::the unpacked suite skipped nothing at all, which means"
            echo "::error::the checkout-dependent tests did not notice they were in"
            echo "::error::an unpacked archive; that is a guard that stopped guarding"
            exit 1
          fi
          unexplained=$(printf '%s\n' "$skips" \
            | grep -vE 'not a git checkout|no sdist in dist/' || true)
          if [ -n "$unexplained" ]; then
            printf '%s\n' "$unexplained"
            echo "::error::the archive's suite skipped for a reason that is not"
            echo "::error::about being unpacked; a test went quiet"
            exit 1
          fi
          printf '%s\n' "$skips" | sed 's/^/  expected: /'
          echo "all $(printf '%s\n' "$skips" | wc -l | tr -d ' ') skips are about the unpacked checkout"
