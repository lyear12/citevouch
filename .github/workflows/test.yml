name: Test

# Every change is checked on the three platforms the tool claims to support.
# A release waits for a green run here: see release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run the suite
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: ruff
        run: |
          ruff check .
          ruff format --check .

  acceptance:
    name: acceptance (the documented first run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      # The first command in the README, run from a directory that contains
      # nothing. A tool that only works in its own checkout does not work.
      - name: init-demo succeeds
        run: |
          cd "$(mktemp -d)"
          python -m citevouch init-demo my-paper
          cd my-paper && python -m citevouch verify manuscript.md

      # The committed demo has exactly one deliberate failure. A greener run
      # means matching became more permissive, which is a regression.
      - name: the demo still says no to the wrong paper
        run: |
          set +e
          python -m citevouch verify demo/manuscript.md --root demo --format json > /tmp/out.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 from the demo (its fcg-editor claim cites the wrong PDF), got $code"
            exit 1
          fi
          python - <<'PY'
          import json
          blob = json.load(open("/tmp/out.json"))
          codes = [f["code"] for f in blob["findings"]]
          if "quote-missing" not in codes:
              raise SystemExit("the deliberate quote-missing is gone; matching got too permissive")
          missing = [f for f in blob["findings"] if f["code"] == "quote-missing"]
          if [f.get("claim_id") for f in missing] != ["fcg-editor"]:
              raise SystemExit(f"unexpected quote-missing claims: {[f.get('claim_id') for f in missing]}")
          print("demo acceptance OK:", blob["summary"])
          PY

      - name: offline
        run: python -m pytest -q -k "not network"
        env:
          # Nothing in src/ may reach the network; the suite proves it by
          # running with proxies pointed at a closed port.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
