# Hooks for https://pre-commit.com
#
# `pre-commit` finds this file at the repository root and offers each entry as a
# hook id. It runs the hook in an isolated environment built from `pyproject.toml`
# unless the repository is already installed, which is why the `entry` names an
# installed console script rather than a path.
#
# The point of the hook is that the check runs before a bad ledger is pushed, not
# after. It reads the committed ledger, never re-records one: a hook that silently
# re-recorded evidence would turn "the file changed under me" into "the file now
# matches", which is the one failure this tool exists to catch. That is an
# argument about which command the hook runs, so it is carried by `args` below and
# not by this paragraph - a comment cannot pass a flag.

- id: citevouch
  name: citevouch - check that every claim still matches its source
  description: >
    Reads the recorded ledger and re-checks each claim against the local source
    files. Fails when a quote moved, went missing, or the source file is no
    longer the one the ledger recorded.
  entry: citevouch check
  language: python
  files: '\.(md|markdown|tex)$'
  # This hook used to say `pass_filenames: false` and nothing else, so
  # pre-commit ran a bare `citevouch check`: exit 2 on a missing
  # argument, no claim read, and every commit refused for a reason that
  # had nothing to do with the manuscript. The manuscript is named here
  # rather than taken from the changed-file list, because `files:`
  # matches every Markdown file in the repository - README included -
  # and `check` takes exactly one. Edit `args` to point at yours.
  #
  # `--use-recorded` is what makes the two paragraphs above true.  Without
  # it `check` scans afresh and never opens the ledger, so a source file
  # replaced by a new version of the same paper - the exact case this hook
  # says it exists to catch - came out green: the quote survives in the new
  # file, and `source-changed` is a verdict only the recorded path reaches.
  # Measured, source replaced but quote still present, default threshold:
  #
  #   citevouch check manuscript.md                  -> 0, [info] quote-found
  #   citevouch check manuscript.md --use-recorded   -> 0, [medium] source-changed
  #
  # A ledger that was never committed or is corrupt fared no better: `check`
  # re-scanned and reported a clean run, where the recorded path refuses with
  # exit 2.  Looking at the wrong evidence quietly is the one outcome this
  # tool exists to prevent.
  #
  # `--fail-on medium` is the second half of the same promise: the sentence
  # above says the hook fails when a quote *moved* or a source file is no
  # longer the recorded one, and both of those are medium.  At the default
  # `high` the recorded path printed them and still exited 0, so the hook
  # could not fail for the two reasons its own description names.
  args: ["manuscript.md", "--use-recorded", "--fail-on", "medium"]
  pass_filenames: false
  require_serial: true
  additional_dependencies: []

- id: citevouch-record
  name: citevouch - record evidence for a changed manuscript
  description: >
    The mutating counterpart. `scan` writes a new ledger; run it deliberately,
    review the diff, and commit the ledger with the manuscript that changed.
  entry: citevouch scan
  language: python
  files: '\.(md|markdown|tex)$'
  args: [manuscript.md]
  pass_filenames: false
  require_serial: true
  additional_dependencies: []
