[build-system]
# setuptools rather than a newer backend on purpose: it is already present in
# almost every pip environment, so `pip install -e .` works on a machine whose
# package index is slow or partially unreachable.  A build backend that has to
# be downloaded before the build starts turns "install" into "install plus a
# network round trip that can fail".
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "citevouch"
version = "0.1.0"
description = "Bind every claim in a manuscript to the page of the local PDF that proves it, and fail CI when that evidence drifts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "citevouch contributors" }]
keywords = [
    "citations",
    "evidence",
    "manuscript",
    "pdf",
    "research-integrity",
    "reproducibility",
    "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/lyear12/citevouch"
Issues = "https://github.com/lyear12/citevouch/issues"
Changelog = "https://github.com/lyear12/citevouch/releases"

[project.scripts]
citevouch = "citevouch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "BLE"]
ignore = ["E501"]
