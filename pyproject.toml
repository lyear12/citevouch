[build-system]
# setuptools rather than a newer backend on purpose: it is already present in
# almost every pip environment, so `pip install -e .` works on a machine whose
# package index is slow or partially unreachable.  A build backend that has to
# be downloaded before the build starts turns "install" into "install plus a
# network round trip that can fail".
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "citevouch"
# The version lives in src/citevouch/_version.py and nowhere else. Keeping it
# here as a literal too meant two places to edit, and the one nobody remembered
# - the package's own __version__ - drifted four releases behind, so
# `citevouch --version`, the SARIF driver version and every ledger's
# tool_version all claimed 0.1.0 while the wheel was 0.4.1. A version number
# that is written down twice is a version number that is wrong once.
dynamic = ["version"]
description = "Bind every claim in a manuscript to the page of the local PDF that proves it, and fail CI when that evidence drifts."
readme = "README.md"
requires-python = ">=3.10"
# SPDX string plus license-files, not a `License ::` classifier: setuptools reads
# the former and deprecates the latter, and a build warning that becomes an error
# in a future setuptools is a release that stops working for no good reason.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "citevouch contributors" }]
keywords = [
    "citations",
    "evidence",
    "manuscript",
    "pdf",
    "research-integrity",
    "reproducibility",
    "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/lyear12/citevouch"
Issues = "https://github.com/lyear12/citevouch/issues"
Changelog = "https://github.com/lyear12/citevouch/releases"

[project.scripts]
citevouch = "citevouch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "citevouch._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "BLE"]
ignore = [
  "E501",
  # RUF001/RUF002/RUF003 warn about "ambiguous" Unicode - a fullwidth colon,
  # an en dash - because they look like a typo in a Latin document. In this
  # project those characters are the input: the tool reads Chinese manuscripts
  # where `：` and `。` are correct orthography, and the tests quote them on
  # purpose. Silencing the rule here is the difference between "the linter
  # understands the domain" and "the domain has to be spelled wrong to pass".
  "RUF001",
  "RUF002",
  "RUF003",
]
